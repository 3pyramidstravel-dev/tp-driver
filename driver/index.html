<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#3b0d0f">
  <meta name="robots" content="noindex,nofollow">
  <title>Three Pyramids — تطبيق السائق</title>
  <link rel="icon" type="image/png" href="../shared/icon-192.png">
  <link rel="apple-touch-icon" href="../shared/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Cinzel:wght@600;700&display=swap">
  <link rel="stylesheet" href="../shared/tp.css">
  <link rel="stylesheet" href="driver.css">
</head>
<body>
  <div class="dv" id="app" hidden>
    <header class="dv-top">
      <img class="dv-logo" src="../shared/logo.png" alt="Three Pyramids Travel">
      <div class="dv-me"><b id="meName"></b><span id="meKind"></span></div>
      <button type="button" class="sos-btn" id="sosBtn" aria-label="استغاثة أو بلاغ">SOS</button>
    </header>
    <div class="dv-status" id="status"></div>
    <main class="dv-main">
      <section id="tab-today" class="dv-tab"></section>
      <section id="tab-missions" class="dv-tab" hidden></section>
      <section id="tab-account" class="dv-tab" hidden></section>
      <section id="tab-car" class="dv-tab" hidden></section>
    </main>
    <div class="wake-ov" id="wakeOv" hidden></div>
    <nav class="dv-nav" aria-label="القائمة">
      <button type="button" data-tab="today" class="on"><i data-icon="route"></i><span>النهارده</span></button>
      <button type="button" data-tab="missions"><i data-icon="file"></i><span>المشاوير</span><b class="dv-badge" id="mBadge" hidden></b></button>
      <button type="button" data-tab="account"><i data-icon="money"></i><span>حسابي</span></button>
      <button type="button" data-tab="car" hidden><i data-icon="car"></i><span>عربيتي</span></button>
    </nav>
  </div>
  <script src="../shared/firebase-config.js"></script>
  <script src="../shared/core.js"></script>
  <script src="../shared/perms.js"></script>
  <script src="../shared/rates.js"></script>
  <script src="../shared/ops.js"></script>
  <script src="../shared/wakecore.js"></script>
  <script src="../shared/flightcore.js"></script>
  <script src="../shared/fleetcore.js"></script>
  <script src="../shared/xlsx.js"></script>
  <script src="../shared/report.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="../shared/guest.js"></script>
  <script src="../shared/fb.js"></script>
  <script src="../shared/session.js"></script>
  <script src="fleet.js"></script>
  <script src="app.js"></script>
</body>
</html>
